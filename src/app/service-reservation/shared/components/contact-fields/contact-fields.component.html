<div class="form-card" [formGroup]="form">
  <h3 class="card-title">
    <span class="card-num" *ngIf="cardNumber !== null">{{ cardNumber }}</span>
    Dane kontaktowe
  </h3>

  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="rsv-firstName">Imię <span class="required">*</span></label>
      <input id="rsv-firstName" type="text" formControlName="firstName" class="form-input"
             [class.invalid]="isInvalid('firstName')" placeholder="Jan" />
      <span *ngIf="isInvalid('firstName')" class="field-error">Imię jest wymagane (min. 2 znaki)</span>
    </div>
    <div class="form-group">
      <label class="form-label" for="rsv-lastName">Nazwisko <span class="required">*</span></label>
      <input id="rsv-lastName" type="text" formControlName="lastName" class="form-input"
             [class.invalid]="isInvalid('lastName')" placeholder="Kowalski" />
      <span *ngIf="isInvalid('lastName')" class="field-error">Nazwisko jest wymagane (min. 2 znaki)</span>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="rsv-email">E-mail <span class="required">*</span></label>
      <input id="rsv-email" type="email" formControlName="email" class="form-input"
             [class.invalid]="isInvalid('email')" placeholder="jan.kowalski@email.com" />
      <span *ngIf="isInvalid('email')" class="field-error">Podaj poprawny adres email</span>
      <span class="field-hint">Na ten adres wyślemy potwierdzenie.</span>
    </div>
    <div class="form-group">
      <label class="form-label" for="rsv-phone">Telefon <span class="required">*</span></label>
      <input id="rsv-phone" type="tel" formControlName="phone" class="form-input"
             [class.invalid]="isInvalid('phone')" placeholder="600123456" maxlength="9" />
      <span *ngIf="isInvalid('phone')" class="field-error">Podaj 9-cyfrowy numer telefonu</span>
    </div>
  </div>
</div>

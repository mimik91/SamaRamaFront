<div class="step2-wrap">
  <div class="step-header">
    <h2>{{ heading }}</h2>
    <p class="step-description">{{ description }}</p>
  </div>

  <div class="summary-grid">
    <div class="summary-card" *ngFor="let card of cards" [class.summary-card--wide]="card.wide">
      <h3 class="summary-card-title">
        <svg *ngIf="card.icon === 'person'" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <svg *ngIf="card.icon === 'bike'" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 0 0-1 1v5.5H5.5l3-5.5m7.5 0H17m-5 0H9"/></svg>
        <svg *ngIf="card.icon === 'calendar'" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <svg *ngIf="card.icon === 'truck'" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        <svg *ngIf="card.icon === 'package'" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>
        {{ card.title }}
      </h3>
      <div class="summary-row" *ngFor="let row of card.rows">
        <span class="summary-label">{{ row.label }}</span>
        <span class="summary-value" [class.highlight-date]="row.highlight">{{ row.value }}</span>
      </div>
    </div>
  </div>

  <p class="summary-info-note" *ngIf="infoNote">{{ infoNote }}</p>

  <div class="cost-summary-card" *ngIf="costs.length > 0">
    <h3 class="cost-summary-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      {{ costTitle }}
    </h3>
    <div class="cost-row" *ngFor="let line of costs" [class.cost-row--total]="line.total">
      <span class="cost-label">{{ line.label }}</span>
      <span class="cost-value" [class.cost-value--neutral]="line.neutral" [class.cost-value--total]="line.total">
        <span *ngIf="line.original" class="cost-original">{{ line.original }}</span>
        {{ line.value }}
      </span>
    </div>
  </div>

  <!-- Kupon rabatowy -->
  <ng-content></ng-content>

  <div class="terms-section">
    <label class="terms-label">
      <input type="checkbox" [formControl]="termsControl" class="terms-checkbox" />
      <span class="terms-text">
        Akceptuję
        <a [href]="links.termsOfService" target="_blank" rel="noopener">Regulamin</a>
        i
        <a [href]="links.privacyPolicy" target="_blank" rel="noopener">Politykę Prywatności</a>.
        Wyrażam zgodę na przetwarzanie danych osobowych w celu realizacji zamówienia.
        Rozumiem, że moje dane ({{ termsDataScope }}) zostaną przekazane serwisowi rowerowemu
        realizującemu zlecenie, aby mógł mnie obsłużyć.
      </span>
    </label>
    <span *ngIf="termsControl.invalid && termsControl.touched" class="field-error">
      Musisz zaakceptować regulamin
    </span>
  </div>

  <div class="form-actions">
    <button type="button" class="btn-secondary" (click)="back.emit()" [disabled]="submitting">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Wróć i edytuj
    </button>
    <button type="button" class="btn-submit" (click)="submitted.emit()" [disabled]="submitting">
      <div *ngIf="submitting" class="btn-spinner"></div>
      <svg *ngIf="!submitting" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      {{ submitting ? submittingLabel : submitLabel }}
    </button>
  </div>
</div>

<div class="pricelist-wrapper">
  <h2 class="wrapper-title">Pakiety i cennik</h2>

  <nav class="tabs-nav" aria-label="Cennik">
    <button
      type="button"
      class="tab-button"
      [class.active]="isActiveTab('packages')"
      [attr.aria-current]="isActiveTab('packages') ? 'page' : null"
      (click)="setActiveTab('packages')">
      {{ t('pricelist.tabs.packages') }}
    </button>
    <button
      type="button"
      class="tab-button"
      [class.active]="isActiveTab('services')"
      [attr.aria-current]="isActiveTab('services') ? 'page' : null"
      (click)="setActiveTab('services')">
      {{ t('pricelist.tabs.services') }}
    </button>
    <button
      type="button"
      class="tab-button"
      [class.active]="isActiveTab('parts')"
      [attr.aria-current]="isActiveTab('parts') ? 'page' : null"
      (click)="setActiveTab('parts')">
      {{ t('pricelist.tabs.parts') }}
    </button>
  </nav>

  <div class="tabs-content">
    <div *ngIf="isActiveTab('packages')" class="tab-panel">
      <app-service-admin-packages [serviceId]="serviceId"></app-service-admin-packages>
    </div>

    <div *ngIf="isActiveTab('services')" class="tab-panel">
      <app-service-admin-pricelist [serviceId]="serviceId"></app-service-admin-pricelist>
    </div>

    <div *ngIf="isActiveTab('parts')" class="tab-panel">
      <app-service-admin-parts [serviceId]="serviceId"></app-service-admin-parts>
    </div>
  </div>
</div>

<div
  class="order-bar"
  [class.compact]="compact"
  [class.has-action]="actionButton !== null"
  [class]="order.repairPlanStatus ? 'order-bar--plan-' + order.repairPlanStatus.toLowerCase() : ''"
  [style.border-left-color]="barStatusColor"
  [title]="repairPlanStatusTooltip"
  (click)="onClick($event)"
>
  <div class="order-unread-badge" *ngIf="order.unreadMessageCount">{{ order.unreadMessageCount }}</div>

  <div class="order-main">
    <div class="order-bike-line">
      <span class="order-brand">{{ bikeBrand }}</span>
      <span class="order-model" *ngIf="bikeModel">&nbsp;{{ bikeModel }}</span>
    </div>

    <div class="order-plan-status-line" *ngIf="order.repairPlanStatus" [class]="'order-plan-status-line--' + order.repairPlanStatus.toLowerCase()">
      <svg *ngIf="order.repairPlanStatus === 'SENT_TO_CLIENT'" xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <svg *ngIf="order.repairPlanStatus === 'ACCEPTED'" xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      <svg *ngIf="order.repairPlanStatus === 'REJECTED'" xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      <span>{{ repairPlanStatusShortLabel }}</span>
    </div>

    <span class="order-customer" *ngIf="customerName">{{ customerName }}</span>
    <span class="order-time" *ngIf="showTime">{{ order.plannedTime }}</span>
  </div>

  <button
    *ngIf="actionButton"
    class="action-btn"
    [style.background]="actionButtonColor"
    (click)="onActionClick($event)"
    [title]="actionButtonLabel"
  >{{ actionButtonLabel }}</button>
</div>

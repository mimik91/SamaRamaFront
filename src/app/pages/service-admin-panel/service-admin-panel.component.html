<div class="admin-panel-container">
  <!-- Loading Services State -->
  <div *ngIf="isLoadingServices" class="loading-state">
    <div class="spinner"></div>
    <p>{{ t('service_admin.loading_services') }}</p>
  </div>

  <!-- Services Error State -->
  <div *ngIf="servicesError" class="error-state">
    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="15" y1="9" x2="9" y2="15"></line>
      <line x1="9" y1="9" x2="15" y2="15"></line>
    </svg>
    <h2>{{ t('service_admin.error_title') }}</h2>
    <p>{{ servicesError }}</p>
    <button (click)="loadMyServices()" class="retry-btn">
      {{ t('service_admin.retry') }}
    </button>
  </div>

  <!-- Main Content -->
  <div *ngIf="!isLoadingServices && !servicesError && myServices.length > 0">
    
    <!-- Loading Details State -->
    <div *ngIf="isLoadingDetails" class="loading-state">
      <div class="spinner"></div>
      <p>{{ t('service_admin.loading_details') }}</p>
    </div>

    <!-- Details Error State -->
    <div *ngIf="detailsError" class="error-state">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
      <h2>{{ t('service_admin.error_title') }}</h2>
      <p>{{ detailsError }}</p>
      <button (click)="loadServiceDetails()" class="retry-btn">
        {{ t('service_admin.retry') }}
      </button>
    </div>

    <!-- Panel Content -->
    <div *ngIf="!isLoadingDetails && !detailsError && serviceDetails" class="panel-content">
      
      <!-- Header -->
      <header class="panel-header">
        <div class="panel-title">
          <h1>{{ t('service_admin.panel_title') }}</h1>
          <div class="service-meta">
            <strong class="service-name">{{ serviceDetails.name }}</strong>
            <a *ngIf="serviceDetails.suffix" class="public-link" [routerLink]="['/', serviceDetails.suffix]" target="_blank" rel="noopener">
              Zobacz profil publiczny
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"></path><path d="M20 4l-9 9"></path><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"></path></svg>
            </a>
          </div>
        </div>

        <!-- Service Selector (only if multiple services) -->
        <div class="service-selector" *ngIf="myServices.length > 1">
          <label for="service-select">{{ t('service_admin.select_service') }}</label>
          <select
            id="service-select"
            [value]="selectedServiceId"
            (change)="onServiceChange($event)"
            class="service-dropdown">
            <option *ngFor="let service of myServices" [value]="service.id">
              {{ service.name }}
            </option>
          </select>
        </div>
      </header>

      <div class="panel-layout">
        <!-- Sections navigation -->
        <nav class="tabs-container" aria-label="Sekcje ustawień">
          <button
            *ngFor="let tab of tabs"
            type="button"
            [class.active]="isTabActive(tab.id)"
            [attr.aria-current]="isTabActive(tab.id) ? 'page' : null"
            (click)="setActiveTab(tab.id)"
            class="tab-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" [ngSwitch]="tab.id">
              <ng-container *ngSwitchCase="'basic'"><path d="M3 9l1.5-5h15L21 9"></path><path d="M4 9v11h16V9"></path><path d="M9 20v-6h6v6"></path></ng-container>
              <ng-container *ngSwitchCase="'services'"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"></path></ng-container>
              <ng-container *ngSwitchCase="'pricelist'"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></ng-container>
              <ng-container *ngSwitchCase="'hours'"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></ng-container>
              <ng-container *ngSwitchCase="'images'"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-8 8"></path></ng-container>
              <ng-container *ngSwitchCase="'reservations'"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18M9 15l2 2 4-4"></path></ng-container>
            </svg>
            <span>{{ t(tab.labelKey) }}</span>
          </button>
        </nav>

      <!-- Tab Content -->
      <div class="tab-content">
        
        <!-- Basic Info Tab -->
        <app-service-admin-basic-info
          *ngIf="activeTab === 'basic'"
          [serviceDetails]="serviceDetails"
          [serviceId]="selectedServiceId!">
        </app-service-admin-basic-info>

        <!-- Services/Coverages Tab -->
        <app-service-admin-coverages
          *ngIf="activeTab === 'services'"
          [serviceId]="selectedServiceId!">
        </app-service-admin-coverages>

        <!-- Pricelist Tab (ZMIANA: używamy wrapper component) -->
        <app-service-admin-pricelist-wrapper
          *ngIf="activeTab === 'pricelist'"
          [serviceId]="selectedServiceId!">
        </app-service-admin-pricelist-wrapper>

        <!-- Opening Hours Tab -->
        <app-service-admin-opening-hours
          *ngIf="activeTab === 'hours'"
          [serviceId]="selectedServiceId!">
        </app-service-admin-opening-hours>

        <!-- Images Tab -->
        <app-service-admin-images
          *ngIf="activeTab === 'images'"
          [serviceId]="selectedServiceId!">
        </app-service-admin-images>

        <!-- Reservations Tab -->
        <app-service-admin-reservations
          *ngIf="activeTab === 'reservations'"
          [serviceDetails]="serviceDetails"
          [serviceId]="selectedServiceId!">
        </app-service-admin-reservations>

      </div>
      </div>
    </div>
  </div>
</div>
